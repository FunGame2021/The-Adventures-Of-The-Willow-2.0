name: AndroidBuild
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  buildForAndroid:
    name: Build for Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - The-Adventures-Of-The-Willow-2.0
        unityVersion:
          - 6000.0.53f1
        targetPlatform:
          - Android

    timeout-minutes: 200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Clean up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: |
            ${{ matrix.projectPath }}/Library/BuildCache
            ${{ matrix.projectPath }}/Library/ScriptAssemblies
          key: Library-${{ matrix.projectPath }}-${{ matrix.targetPlatform }}-${{ hashFiles(format('{0}/Assets/**', matrix.projectPath)) }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-${{ matrix.targetPlatform }}-
            Library-${{ matrix.projectPath }}-
            Library-

      - name: Fix potential Unity issues
        run: |
          # Clean problematic directories
          rm -rf ${{ matrix.projectPath }}/Library
          rm -rf ${{ matrix.projectPath }}/Temp
          # Commit font asset changes if needed
          git add ./Assets/TextMesh\ Pro/Resources/Fonts\ &\ Materials/LiberationSans\ SDF\ -\ Fallback.asset || true

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ matrix.projectPath }}
          unityVersion: ${{ matrix.unityVersion }}
          targetPlatform: ${{ matrix.targetPlatform }}
          androidAppBundle: false
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME || '' }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS || '' }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME || '' }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS || '' }}
          customParameters: >-
            -quit
            -nographics
            -logFile /dev/stdout
            -developmentBuild

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build_Android
          path: build
